[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastsymbolicgp"
version = "1.0.0"
description = "Stable high-performance symbolic regression and classification with exact champion selection, adaptive execution planning, and fused Numba fitness."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Nikola Anđelić"}]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "threadpoolctl>=3.1"
]

[project.optional-dependencies]
acceleration = ["numba>=0.58"]
dev = ["pytest>=7", "pandas>=2", "build>=1"]

[project.scripts]
fastsymbolicgp-diagnose = "fastsymbolicgp.cli:diagnose"
fastsymbolicgp-benchmark = "fastsymbolicgp.cli:benchmark"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
